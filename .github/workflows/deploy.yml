name: Deploy to Server via FTPS

on:
  push:
    branches:
      - main

jobs:
  ftp-deploy:
    name: Deploy PHP site
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Upload via FTPS (explicit TLS/SSL)
        uses: milanmk/actions-file-deployer@master
        with:
          remote-protocol: "ftp"
          remote-host: ${{ secrets.FTP_SERVER }}
          remote-port: 21
          remote-user: ${{ secrets.FTP_USERNAME }}
          remote-password: ${{ secrets.FTP_PASSWORD }}
          local-path: "."
          remote-path: "."
          # "full" mirrors everything; once a first successful deploy has run,
          # you can switch this to "delta" so only changed files are uploaded
          sync: "full"
          # Forces explicit FTPS (AUTH TLS) on the control connection
          ftp-options: "set ftp:ssl-allow true;"