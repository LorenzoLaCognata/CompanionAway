name: Deploy to Server via FTPS

on:
  push:
    branches:
      - main

jobs:
  ftp-deploy:
    name: Deploy PHP site
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 20

      - name: Build minified CSS
        run: |
          npm install -g lightningcss-cli
          for f in main-style home-style travel-relocation-style document-style shared-demo intake-style inventory-style legal-style; do
            lightningcss --minify --output-file "assets/css/${f}.min.css" "assets/css/${f}.css"
          done

      - name: Upload via FTPS (explicit TLS/SSL)
        uses: milanmk/actions-file-deployer@master
        with:
          remote-protocol: "ftp"
          remote-host: ${{ secrets.FTP_SERVER }}
          remote-port: 21
          remote-user: ${{ secrets.FTP_USERNAME }}
          remote-password: ${{ secrets.FTP_PASSWORD }}
          local-path: "."
          remote-path: "/"
          sync: "delta"
          sync-delta-excludes: ':!private/config.php'
          sync-delta-includes: "assets/css/main-style.min.css,assets/css/home-style.min.css,assets/css/travel-relocation-style.min.css,assets/css/document-style.min.css,assets/css/shared-demo.min.css,assets/css/intake-style.min.css,assets/css/inventory-style.min.css,assets/css/legal-style.min.css"
          ftp-options: "set ftp:ssl-allow true;"