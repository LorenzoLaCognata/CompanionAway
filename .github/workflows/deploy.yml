name: Deploy to Server via FTPS

on:
  push:
    branches:
      - main

jobs:
  ftp-deploy:
    name: Deploy PHP site
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build minified CSS
        run: |
          npm install -g clean-css-cli
          for f in main-style home-style travel-relocation-style document-style shared-demo intake-style inventory-style; do
            cleancss -o "assets/css/${f}.min.css" "assets/css/${f}.css"
          done

      - name: Upload via FTPS (explicit TLS/SSL)
        uses: milanmk/actions-file-deployer@master
        with:
          remote-protocol: "ftp"
          remote-host: ${{ secrets.FTP_SERVER }}
          remote-port: 21
          remote-user: ${{ secrets.FTP_USERNAME }}
          remote-password: ${{ secrets.FTP_PASSWORD }}
          local-path: "."
          remote-path: "/"
          sync: "delta"
          ftp-options: "set ftp:ssl-allow true;"